[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-agent-mcp"
version = "0.2.0"
description = "A local, UI-free five-provider flight MCP server with iOS Bark notifications"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "mcp==2.3.0",
  "playwright==1.64.1",
  "pydantic>=2.12,<3",
  "zstandard==0.25.0",
  "tzdata==2026.5",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
flight-mcp = "flight_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flight_mcp.vendor" = ["LICENSE", "NOTICE", "source.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

name: Test MCP service
on: [push, pull_request]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m compileall -q src/flight_mcp
      - run: python -m pytest -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Pack and install the actual distributable
        shell: bash
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          npm install --prefix build/npm-smoke --ignore-scripts ./dist/flight-agent-mcp-0.2.0.tgz
      - name: Install Linux browser system dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium
      - name: Bootstrap without a preinstalled uv
        run: node build/npm-smoke/node_modules/flight-agent-mcp/npm/cli.mjs setup
      - name: Verify npm MCP discovery, tool call and browser launch
        run: python examples/verify_npm.py build/npm-smoke/node_modules/flight-agent-mcp/npm/cli.mjs --check-browser
